<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bldg-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bldg-center" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="bldg-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="city-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.6" />
    </filter>
    <filter id="beacon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-city)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Moon / Celestial Time Indicator -->
  <circle cx="380" cy="125" r="45" fill="url(#moon-glow)" />
  <path d="M 388 95 A 32 32 0 1 0 402 148 A 38 38 0 1 1 388 95 Z" fill="#fbbf24" />
  
  <!-- Tiny Twinkling Stars -->
  <circle cx="115" cy="115" r="3.5" fill="#f8fafc" opacity="0.9" />
  <circle cx="210" cy="90" r="2.5" fill="#f8fafc" opacity="0.7" />
  <circle cx="280" cy="135" r="3" fill="#38bdf8" opacity="0.9" />

  <!-- Distant Background Silhouette Towers -->
  <rect x="75" y="240" width="55" height="180" fill="#1e293b" opacity="0.7" rx="2" />
  <rect x="145" y="215" width="50" height="205" fill="#334155" opacity="0.6" rx="2" />
  <rect x="315" y="195" width="65" height="225" fill="#1e293b" opacity="0.7" rx="2" />
  <rect x="390" y="250" width="50" height="170" fill="#334155" opacity="0.6" rx="2" />

  <!-- Foreground Skyline Group with Drop Shadow -->
  <g filter="url(#city-shadow)">
    <!-- Spire on Center Landmark Tower -->
    <rect x="253" y="90" width="6" height="65" fill="#f8fafc" />
    <circle cx="256" cy="88" r="7" fill="#f43f5e" filter="url(#beacon-glow)" />

    <!-- Left Tower (Modern Office) -->
    <rect x="95" y="260" width="85" height="160" fill="url(#bldg-left)" rx="4" />
    <!-- Left Tower Windows -->
    <g fill="#0f172a" opacity="0.8">
      <rect x="110" y="280" width="12" height="10" rx="1.5" />
      <rect x="132" y="280" width="12" height="10" rx="1.5" />
      <rect x="154" y="280" width="12" height="10" rx="1.5" />
      <rect x="110" y="305" width="12" height="10" rx="1.5" />
      <rect x="132" y="305" width="12" height="10" rx="1.5" />
      <rect x="154" y="305" width="12" height="10" rx="1.5" />
      <rect x="110" y="330" width="12" height="10" rx="1.5" />
      <rect x="132" y="330" width="12" height="10" rx="1.5" />
      <rect x="154" y="330" width="12" height="10" rx="1.5" />
      <rect x="110" y="355" width="12" height="10" rx="1.5" />
      <rect x="132" y="355" width="12" height="10" rx="1.5" />
      <rect x="154" y="355" width="12" height="10" rx="1.5" />
    </g>

    <!-- Center Landmark Skyscraper -->
    <path d="M 215 155 L 297 155 L 308 420 L 204 420 Z" fill="url(#bldg-center)" />
    <!-- Center Tower Windows / Slits -->
    <g fill="#0f172a" opacity="0.85">
      <rect x="226" y="180" width="18" height="12" rx="2" />
      <rect x="268" y="180" width="18" height="12" rx="2" />
      <rect x="226" y="210" width="18" height="12" rx="2" />
      <rect x="268" y="210" width="18" height="12" rx="2" />
      <rect x="226" y="240" width="18" height="12" rx="2" />
      <rect x="268" y="240" width="18" height="12" rx="2" />
      <rect x="226" y="270" width="18" height="12" rx="2" />
      <rect x="268" y="270" width="18" height="12" rx="2" />
      <rect x="226" y="300" width="18" height="12" rx="2" />
      <rect x="268" y="300" width="18" height="12" rx="2" />
      <rect x="226" y="330" width="18" height="12" rx="2" />
      <rect x="268" y="330" width="18" height="12" rx="2" />
    </g>
    <!-- Center Tower Golden Lit Observation Deck -->
    <rect x="215" y="360" width="82" height="14" fill="#fbbf24" rx="2" opacity="0.9" />

    <!-- Right Tower (Angled Crown) -->
    <path d="M 325 235 L 405 190 L 405 420 L 325 420 Z" fill="url(#bldg-right)" />
    <!-- Right Tower Architectural Slits -->
    <line x1="348" y1="250" x2="348" y2="400" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <line x1="368" y1="235" x2="368" y2="400" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <line x1="388" y1="220" x2="388" y2="400" stroke="#fef08a" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Ground Line -->
  <line x1="60" y1="420" x2="452" y2="420" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
</svg>