<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-transit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="train-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="train-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#431407" flood-opacity="0.5" />
    </filter>
    <filter id="light-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-transit)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffedd5" stroke-width="2" stroke-opacity="0.35" />

  <!-- Speed Motion Trails in Background -->
  <line x1="50" y1="160" x2="150" y2="160" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="30" y1="210" x2="120" y2="210" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" opacity="0.5" />
  <line x1="360" y1="170" x2="470" y2="170" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="390" y1="220" x2="480" y2="220" stroke="#ffedd5" stroke-width="5" stroke-linecap="round" opacity="0.5" />

  <!-- High-Speed Dual Rails Converging from Horizon -->
  <line x1="210" y1="360" x2="105" y2="470" stroke="#ffedd5" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="302" y1="360" x2="407" y2="470" stroke="#ffedd5" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <!-- Rail Ties / Ties in Perspective -->
  <line x1="180" y1="395" x2="332" y2="395" stroke="#ffedd5" stroke-width="4" opacity="0.4" />
  <line x1="145" y1="430" x2="367" y2="430" stroke="#ffedd5" stroke-width="5" opacity="0.5" />
  <line x1="115" y1="465" x2="397" y2="465" stroke="#ffedd5" stroke-width="6" opacity="0.6" />

  <!-- Bullet Train Main Body (Front Dynamic View) -->
  <g filter="url(#train-shadow)">
    <!-- Aerodynamic Outer Shell -->
    <path d="M 210 125
             C 230 115 282 115 302 125
             C 328 140 355 200 360 270
             C 365 330 358 375 348 385
             C 340 392 315 395 256 395
             C 197 395 172 392 164 385
             C 154 375 147 330 152 270
             C 157 200 184 140 210 125 Z"
          fill="url(#train-body)" stroke="#ffffff" stroke-width="3" />

    <!-- Sleek Aerodynamic Windscreen (Cockpit Glass) -->
    <path d="M 220 155
             C 235 148 277 148 292 155
             C 310 165 322 205 324 235
             C 305 242 275 245 256 245
             C 237 245 207 242 188 235
             C 190 205 202 165 220 155 Z"
          fill="url(#windshield)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Glass Light Reflection Slash -->
    <path d="M 230 162 L 245 162 L 210 230 L 198 230 Z" fill="#38bdf8" opacity="0.5" />

    <!-- Dynamic Speed Racing Stripe (Cyan/Teal) -->
    <path d="M 154 285
             C 185 292 225 296 256 296
             C 287 296 327 292 358 285
             L 355 310
             C 325 318 285 322 256 322
             C 227 322 187 318 157 310 Z"
          fill="#0284c7" />

    <!-- Front Nose Lower Grill / Aerodynamic Crease -->
    <path d="M 230 345 C 245 350 267 350 282 345" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Dual Bright Headlights -->
    <circle cx="195" cy="335" r="14" fill="#fef08a" filter="url(#light-glow)" />
    <circle cx="195" cy="335" r="8" fill="#ffffff" />
    <circle cx="317" cy="335" r="14" fill="#fef08a" filter="url(#light-glow)" />
    <circle cx="317" cy="335" r="8" fill="#ffffff" />

    <!-- Light Cones Projecting onto Tracks -->
    <polygon points="195,345 130,440 220,440" fill="#fef08a" opacity="0.2" />
    <polygon points="317,345 292,440 382,440" fill="#fef08a" opacity="0.2" />
  </g>
</svg>